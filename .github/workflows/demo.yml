name: Demo

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Approved successful Tests run ID for this ref's exact commit and Pages files
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_BASE_COMMIT: ${{ vars.RELEASE_BASE_COMMIT }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/reuse-candidate
        with:
          candidate_run_id: ${{ inputs.candidate_run_id }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/chonky-candidate/pages

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v5
