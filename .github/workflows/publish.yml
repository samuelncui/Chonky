name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_BASE_COMMIT: ${{ vars.RELEASE_BASE_COMMIT }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify exact release source and squash boundary
        run: node scripts/verify-release.mjs "$RELEASE_TAG"
      - name: Install pinned content scanner
        run: |
          bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: Scan source and complete history
        run: node scripts/check-content.mjs source . HEAD
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm e2e
      - run: pnpm e2e:pages
      - run: mkdir "$RUNNER_TEMP/chonky-packages"
      - name: Pack @samuelncui/chonky
        working-directory: packages/chonky
        run: pnpm pack --out "$RUNNER_TEMP/chonky-packages/chonky.tgz"
      - name: Pack @samuelncui/chonky-icon-fontawesome
        working-directory: packages/chonky-icon-fontawesome
        run: pnpm pack --out "$RUNNER_TEMP/chonky-packages/chonky-icon-fontawesome.tgz"
      - name: Check exact publication inputs
        run: |
          node scripts/verify-release.mjs "$RELEASE_TAG"
          node scripts/check-content.mjs artifacts "$RUNNER_TEMP/chonky-packages"
          node scripts/check-content.mjs artifacts packages/chonky/example/dist
          shasum -a 512 "$RUNNER_TEMP/chonky-packages/"*.tgz
      - name: Publish @samuelncui/chonky
        run: npm publish "$RUNNER_TEMP/chonky-packages/chonky.tgz" --access public
      - name: Publish @samuelncui/chonky-icon-fontawesome
        run: npm publish "$RUNNER_TEMP/chonky-packages/chonky-icon-fontawesome.tgz" --access public
