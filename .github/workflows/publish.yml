name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release.mjs "$RELEASE_TAG"
      - name: Pack @samuelncui/chonky
        working-directory: packages/chonky
        run: pnpm pack --out "$RUNNER_TEMP/chonky.tgz"
      - name: Pack @samuelncui/chonky-icon-fontawesome
        working-directory: packages/chonky-icon-fontawesome
        run: pnpm pack --out "$RUNNER_TEMP/chonky-icon-fontawesome.tgz"
      - name: Publish @samuelncui/chonky
        run: npm publish "$RUNNER_TEMP/chonky.tgz" --access public
      - name: Publish @samuelncui/chonky-icon-fontawesome
        run: npm publish "$RUNNER_TEMP/chonky-icon-fontawesome.tgz" --access public
