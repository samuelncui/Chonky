name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Approved successful Tests run ID for this version tag's exact commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_BASE_COMMIT: ${{ vars.RELEASE_BASE_COMMIT }}
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      CANDIDATE_RELEASE_BODY: ${{ github.event.release.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/reuse-candidate
        with:
          candidate_run_id: ${{ inputs.candidate_run_id }}
      - name: Publish @samuelncui/chonky
        run: npm publish "$RUNNER_TEMP/chonky-candidate/packages/chonky.tgz" --access public
      - name: Publish @samuelncui/chonky-icon-fontawesome
        run: npm publish "$RUNNER_TEMP/chonky-candidate/packages/chonky-icon-fontawesome.tgz" --access public
